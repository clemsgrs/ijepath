pretraining:
  mode: canonical

data:
  slide_manifest_csv:
  slide_metadata_parquet:
  anchor_catalog_manifest:
  batch_size_per_gpu: 64
  num_workers: 16
  anchor_stream_batch_size: 4096
  max_open_slides_per_worker: 32

canonical:
  input_mpp: 0.5
  source_tile_size_px: 256
  crop_size_px: 224
  enc_mask_scale: [0.85, 1.0]
  pred_mask_scale: [0.15, 0.2]
  aspect_ratio: [0.75, 1.5]
  num_enc_masks: 1
  num_pred_masks: 4
  min_keep: 16

meta:
  architecture: vit_small
  patch_size: 16
  pred_depth: 3
  pred_emb_dim: 192
  use_bfloat16: true
  load_checkpoint: false

optimization:
  total_images_budget: 1000000
  warmup: 0.1
  lr: 0.0002
  start_lr: 0.00002
  final_lr: 0.000001
  weight_decay: 0.04
  final_weight_decay: 0.1
  ema: [0.996, 1.0]

training:
  log_every: 10000
  save_every: 10000

tuning:
  enable: true
  seed: 0
  tune_every: 100000
  run_baseline_at_zero: true
  execution:
    mode: async
    device: auto
    max_pending_jobs: 2
    coalesce_policy: newest
    poll_every_steps: auto
    fail_on_backlog: false
    keep_last_n_snapshots: ${tuning.execution.max_pending_jobs}
  data_dir: /data/pathology/projects/clement/discern/data/eval
  plugins:
    - type: pathorob
      enable: true
      batch_size_per_gpu: ${data.batch_size_per_gpu}
      num_workers: ${data.num_workers}
      feature_num_workers: ${data.num_workers}
      feature_persistent_workers: true
      feature_prefetch_factor: 4
      enforce_square_inputs: true
      transforms:
        resize: 256
        crop_size: 256
        normalize: imagenet
      datasets:
        camelyon:
          enable: true
          manifest_csv: ${tuning.data_dir}/pathorob/camelyon/manifest.csv
          id_centers: ["RUMC", "UMCU"]
          ood_centers: ["CWZ", "RST", "LPON"]
        prostate-shift-binary:
          enable: false
          manifest_csv: ${tuning.data_dir}/prostate-shift-binary/manifest.csv
          id_centers: ["BIDMC"]
          ood_centers: ["BWH", "MGH", "NYU", "UCLA", "UPENN", "VUMC"]
      ri:
        enable: true
        every_n_evals: 1
        k_candidates: [3, 5, 7, 10, 15]
      apd:
        enable: true
        every_n_evals: 1
        mode: custom
        correlation_levels: [0.0, 0.14, 0.29, 0.43, 0.57, 0.71, 0.86, 1.0]
        repetitions: 3
        id_test_fraction: 0.2
      clustering:
        enable: true
        every_n_evals: 5
        repeats: 5
        k_min: 2
        k_max: 10
  early_stopping:
    enable: false
    selection:
      plugin: pathorob
      dataset: camelyon
      metric: apd_avg
    patience_evals: 5
    min_evals: 3
    stop_training: false
    save_best_checkpoint: true
    best_checkpoint_name: best-robustness.pth.tar

output:
  root: outputs
  shared_cache_root: ${output.root}/cache

logging:
  write_tag: jepa-canonical-pathorob
  step_log_every_images: 0

wandb:
  enable: true
  exp_name: pathorob-camelyon-canonical
